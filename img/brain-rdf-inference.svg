<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Reasoning over brain knowledge</title>
  <desc id="desc">A white brain above a three-node RDF graph within a blue circle. Solid links show known relationships and a dashed arrow shows an inferred relationship.</desc>
