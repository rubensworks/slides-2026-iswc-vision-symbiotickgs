      <path d="M0,-35 V36 M-29,-31 C-29,-20 -22,-16 -15,-17 M29,-31 C29,-20 22,-16 15,-17 M-43,-6 C-32,-11 -22,-5 -22,5 M43,-6 C32,-11 22,-5 22,5 M-33,27 C-31,17 -20,13 -12,19 M33,27 C31,17 20,13 12,19"/>
    </g>
  <g id="rdf-inference" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 85 V96 M75 106 L53 122 M85 106 L107 122"/>
    <path d="M58 126 H62 M69 126 H73 M80 126 H84 M91 126 H100"/>
    <path d="M96 121 L101 126 L96 131"/>
